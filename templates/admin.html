<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Slavic Meter · Admin</title>
<link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.4/dist/chart.umd.min.js"></script>
<style>
  body { background: linear-gradient(160deg, #1a1a2e 0%, #16213e 100%); color: #eee; }
  header { padding: 20px 16px 6px; text-align: left; max-width: 1100px; margin: 0 auto; }
  header h1 { font-size: 32px; margin: 0; }
  header .tag { opacity: 0.6; font-size: 14px; }
  main.admin { max-width: 1100px; margin: 0 auto; padding: 12px 16px 60px; display: flex; flex-direction: column; gap: 16px; }
  .stat-row { display: grid; grid-template-columns: repeat(auto-fit, minmax(180px, 1fr)); gap: 12px; }
  .stat {
    background: rgba(255,255,255,0.07); border-radius: 12px; padding: 14px 16px;
    border: 1px solid rgba(255,255,255,0.1);
  }
  .stat .n { font-size: 30px; font-weight: 900; color: #ffb84d; line-height: 1; }
  .stat .l { font-size: 12px; opacity: 0.7; margin-top: 4px; text-transform: uppercase; letter-spacing: 1px; }
  .panel {
    background: rgba(255,255,255,0.05); border-radius: 12px; padding: 16px 18px;
    border: 1px solid rgba(255,255,255,0.08);
  }
  .panel h2 { margin: 0 0 12px; font-size: 16px; text-transform: uppercase; letter-spacing: 1.5px; opacity: 0.85; }
  #chartWrap { position: relative; height: 320px; }
  table { width: 100%; border-collapse: collapse; font-size: 13px; }
  th, td { text-align: left; padding: 8px 10px; border-bottom: 1px solid rgba(255,255,255,0.08); }
  th { color: #ffb84d; font-weight: 700; letter-spacing: 0.5px; text-transform: uppercase; font-size: 11px; }
  tr:hover td { background: rgba(255,255,255,0.04); }
  .city-cell { font-weight: 700; }
  .v-cell { font-family: 'Menlo', monospace; color: #ffb84d; }
  .note-cell { opacity: 0.75; font-style: italic; }
  .controls { display: flex; gap: 8px; align-items: center; margin-bottom: 12px; flex-wrap: wrap; }
  .controls button, .controls a {
    background: #ffb84d; color: #1a1a2e; border: none; padding: 6px 12px; border-radius: 6px;
    font-weight: 700; font-size: 12px; cursor: pointer; text-decoration: none;
  }
  .controls .lm { opacity: 0.6; font-size: 12px; margin-left: auto; }
</style>
</head>
<body>
<header>
  <h1>😤 Slavic Meter · Admin</h1>
  <p class="tag">tutte le rilevazioni, in ordine cronologico</p>
</header>
<main class="admin">
  <div class="stat-row">
    <div class="stat"><div class="n" id="statTotal">–</div><div class="l">rilevazioni totali</div></div>
    <div class="stat"><div class="n" id="statAvg">–</div><div class="l">slavic media</div></div>
    <div class="stat"><div class="n" id="statMax">–</div><div class="l">max (peggior giorno)</div></div>
    <div class="stat"><div class="n" id="statLast">–</div><div class="l">ultima entry</div></div>
  </div>

  <div class="panel">
    <h2>Storico 📈</h2>
    <div id="chartWrap"><canvas id="chart"></canvas></div>
  </div>

  <div class="panel">
    <h2>Elenco 📋</h2>
    <div class="controls">
      <button id="refreshBtn">↻ ricarica</button>
      <button id="exportBtn">⤓ CSV</button>
      <span class="lm">chiave admin: <code>{{ admin_key }}</code></span>
    </div>
    <div style="overflow-x:auto">
      <table id="tbl">
        <thead><tr><th>id</th><th>quando</th><th>%</th><th>città</th><th>emoji</th><th>nota</th></tr></thead>
        <tbody id="tbody"><tr><td colspan="6">caricamento...</td></tr></tbody>
      </table>
    </div>
  </div>
</main>
<script>
const KEY = {{ admin_key|tojson }};
let CHART = null;

function fmtTs(ts) {
  const d = new Date(ts * 1000);
  return d.toLocaleString('it-IT', { day:'2-digit', month:'short', hour:'2-digit', minute:'2-digit' });
}

async function load() {
  const r = await fetch('/api/entries?key=' + encodeURIComponent(KEY) + '&limit=1000');
  if (!r.ok) { document.getElementById('tbody').innerHTML = '<tr><td colspan="6">errore: HTTP ' + r.status + '</td></tr>'; return; }
  const rows = await r.json();
  renderStats(rows);
  renderChart(rows);
  renderTable(rows);
}

function renderStats(rows) {
  document.getElementById('statTotal').textContent = rows.length;
  if (!rows.length) return;
  const avg = rows.reduce((s,r)=>s+r.value,0)/rows.length;
  const max = rows.reduce((m,r)=>r.value>m.value?r:m, rows[0]);
  document.getElementById('statAvg').textContent = avg.toFixed(1) + '%';
  document.getElementById('statMax').textContent = max.value.toFixed(1) + '% ' + max.emoji;
  document.getElementById('statLast').textContent = fmtTs(rows[0].ts);
}

function renderChart(rows) {
  const asc = [...rows].sort((a,b)=>a.ts-b.ts);
  const labels = asc.map(r => fmtTs(r.ts));
  const data = asc.map(r => r.value);
  if (CHART) CHART.destroy();
  const ctx = document.getElementById('chart').getContext('2d');
  CHART = new Chart(ctx, {
    type: 'line',
    data: {
      labels,
      datasets: [{
        label: 'Slavic %',
        data,
        borderColor: '#ffb84d',
        backgroundColor: 'rgba(255,184,77,0.15)',
        fill: true,
        tension: 0.3,
        pointRadius: 3,
        pointBackgroundColor: '#ffb84d',
        pointBorderColor: '#1a1a2e'
      }]
    },
    options: {
      responsive: true, maintainAspectRatio: false,
      scales: {
        y: { min: 0, max: 100, grid: { color: 'rgba(255,255,255,0.06)' }, ticks: { color: '#bbb' } },
        x: { grid: { color: 'rgba(255,255,255,0.06)' }, ticks: { color: '#bbb', maxTicksLimit: 8 } }
      },
      plugins: {
        legend: { labels: { color: '#eee' } },
        tooltip: {
          callbacks: {
            afterLabel: ctx => {
              const r = asc[ctx.dataIndex];
              return `${r.emoji} ${r.city}${r.note ? '\n"'+r.note+'"' : ''}`;
            }
          }
        }
      }
    }
  });
}

function renderTable(rows) {
  const tb = document.getElementById('tbody');
  if (!rows.length) { tb.innerHTML = '<tr><td colspan="6">nessuna entry.</td></tr>'; return; }
  tb.innerHTML = rows.map(r =>
    `<tr>
      <td>${r.id}</td>
      <td>${fmtTs(r.ts)}</td>
      <td class="v-cell">${r.value.toFixed(1)}</td>
      <td class="city-cell">${r.city}</td>
      <td style="font-size:18px">${r.emoji}</td>
      <td class="note-cell">${(r.note||'').replace(/[<>&]/g, c => ({'<':'&lt;','>':'&gt;','&':'&amp;'}[c]))}</td>
    </tr>`).join('');
}

function exportCsv() {
  fetch('/api/entries?key=' + encodeURIComponent(KEY) + '&limit=5000').then(r=>r.json()).then(rows => {
    const csv = 'id,ts_iso,value,city,country,emoji,note\n' + rows.map(r =>
      [r.id, new Date(r.ts*1000).toISOString(), r.value, r.city, r.country, r.emoji,
       '"'+(r.note||'').replace(/"/g,'""')+'"'].join(',')
    ).join('\n');
    const a = document.createElement('a');
    a.href = URL.createObjectURL(new Blob([csv], {type:'text/csv'}));
    a.download = 'slavic-meter-' + new Date().toISOString().slice(0,10) + '.csv';
    a.click();
  });
}

document.getElementById('refreshBtn').addEventListener('click', load);
document.getElementById('exportBtn').addEventListener('click', exportCsv);
load();
setInterval(load, 30000); // auto-refresh every 30s
</script>
</body>
</html>
